<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI涂抹消除 · 功能上新</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    background: #050508;
  }

  .poster {
    width: 750px;
    background: linear-gradient(180deg, #070710 0%, #0a0a18 30%, #0c0c1c 60%, #080816 100%);
    color: #e8e8ee;
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    position: relative;
    padding-bottom: 48px;
  }

  /* Grid background */
  .grid-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .glow-top {
    position: absolute;
    top: -100px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 300px;
    background: radial-gradient(ellipse, rgba(59, 130, 246, 0.12) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  .section { position: relative; z-index: 1; }

  /* ========== HEADER ========== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 32px 0;
  }

  .logo { height: 22px; opacity: 0.85; }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px 0;
  }

  .header-left {
    font-size: 14px;
    color: rgba(180, 190, 220, 0.7);
    letter-spacing: 2px;
  }

  .header-tag {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(34, 197, 94, 0.15));
    border: 1px solid rgba(59, 130, 246, 0.35);
    border-radius: 16px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 500;
    color: #60a5fa;
    letter-spacing: 1px;
  }

  /* ========== TITLE SECTION ========== */
  .title-wrap {
    text-align: center;
    padding: 32px 40px 0;
  }

  .system-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 16px;
  }

  .system-line::before,
  .system-line::after {
    content: '';
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.5), transparent);
  }

  .system-text {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 4px;
    color: rgba(100, 160, 255, 0.6);
  }

  .main-title {
    font-size: 52px;
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: 8px;
    color: #ffffff;
    text-shadow: 0 0 60px rgba(59, 130, 246, 0.35);
  }

  .main-title .blue {
    background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #22d3ee 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .sub-title {
    margin-top: 16px;
    font-size: 15px;
    font-weight: 400;
    line-height: 1.8;
    color: rgba(160, 180, 220, 0.75);
    letter-spacing: 1px;
  }

  /* ========== COMPARISON SECTION ========== */
  .compare-section {
    padding: 28px 32px 0;
  }

  .compare-card {
    background: rgba(10, 12, 25, 0.6);
    border: 1px solid rgba(59, 130, 246, 0.15);
    border-radius: 16px;
    padding: 20px;
    position: relative;
  }

  .compare-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .case-label {
    font-size: 13px;
    font-weight: 500;
    color: rgba(180, 190, 220, 0.8);
    letter-spacing: 2px;
  }

  .case-label strong {
    color: #60a5fa;
    font-weight: 600;
  }

  .case-tag {
    background: rgba(59, 130, 246, 0.12);
    border: 1px solid rgba(59, 130, 246, 0.25);
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 12px;
    color: #93c5fd;
    letter-spacing: 1px;
  }

  /* Compare row (side by side) */
  .compare-row {
    display: flex;
    gap: 10px;
  }

  .compare-img-wrap {
    flex: 1;
    aspect-ratio: 3/4;
    max-height: 420px;
    border-radius: 10px;
    overflow: hidden;
    background: #050510;
  }

  .compare-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Bottom labels */
  .compare-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
  }

  .label-pill {
    padding: 6px 16px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
  }

  .label-pill.before {
    background: rgba(200, 50, 50, 0.15);
    border: 1px solid rgba(200, 50, 50, 0.3);
    color: #f87171;
  }

  .label-pill.after {
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: #4ade80;
  }

  /* ========== FEATURE CARDS ========== */
  .features {
    display: flex;
    gap: 12px;
    padding: 24px 32px 0;
  }

  .feature-card {
    flex: 1;
    background: rgba(20, 25, 45, 0.5);
    border: 1px solid rgba(100, 120, 180, 0.15);
    border-radius: 12px;
    padding: 18px 12px;
    text-align: center;
  }

  .feature-title {
    font-size: 15px;
    font-weight: 600;
    color: #e8e8ee;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .feature-desc {
    font-size: 11px;
    color: rgba(150, 170, 210, 0.6);
    letter-spacing: 1px;
  }

  /* ========== CTA SECTION ========== */
  .cta-section {
    padding: 24px 32px 0;
  }

  .cta-card {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(34, 197, 94, 0.08));
    border: 1px solid rgba(59, 130, 246, 0.25);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
  }

  .cta-label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 4px;
    color: rgba(100, 160, 255, 0.7);
    margin-bottom: 8px;
  }

  .cta-main {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #ffffff;
  }

  .cta-main .dot {
    color: #60a5fa;
    margin: 0 8px;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="grid-bg"></div>
  <div class="glow-top"></div>

  <!-- Header -->
  <div class="section header">
    <img class="logo" src="海报素材/酷家乐-横-白.png" alt="酷家乐">
    <img class="logo" src="海报素材/白色-横版.png" alt="群核科技">
  </div>

  <div class="section header-row">
    <span class="header-left">门窗AI智能设计平台 · 功能上新</span>
    <span class="header-tag">新上线一键 AI 消除能力</span>
  </div>

  <!-- Title -->
  <div class="section title-wrap">
    <div class="system-line">
      <span class="system-text">KUJIALE AI SYSTEM</span>
    </div>
    <h1 class="main-title"><span class="blue">一点</span> 一涂 <span class="blue">杂物消失</span></h1>
    <p class="sub-title">点一下、涂一笔，秒变干净效果图<br>再也不怕脚手架和现场杂乱</p>
  </div>

  <!-- Comparison -->
  <div class="section compare-section">
    <div class="compare-card">
      <div class="compare-header">
        <span class="case-label">室外案例 <strong>|</strong> 一键消除脚手架</span>
        <span class="case-tag">BEFORE / AFTER</span>
      </div>
      <div class="compare-row">
        <div class="compare-img-wrap">
          <img src="海报素材/消除前1.jpg" alt="消除前">
        </div>
        <div class="compare-img-wrap">
          <img src="海报素材/消除后1.png" alt="AI消除后">
        </div>
      </div>
      <div class="compare-footer">
        <span class="label-pill before">消除前</span>
        <span class="label-pill after">AI 消除后</span>
      </div>
    </div>
  </div>

  <!-- Features -->
  <div class="section features">
    <div class="feature-card">
      <div class="feature-title">涂抹杂物</div>
      <div class="feature-desc">智能一涂即消</div>
    </div>
    <div class="feature-card">
      <div class="feature-title">秒级出图</div>
      <div class="feature-desc">极速完成渲染</div>
    </div>
    <div class="feature-card">
      <div class="feature-title">手机即用</div>
      <div class="feature-desc">随时随地展示</div>
    </div>
  </div>

  <!-- CTA -->
  <div class="section cta-section">
    <div class="cta-card">
      <div class="cta-label">SPECIAL EXPERIENCE</div>
      <div class="cta-main">7.10 全网发布<span class="dot">·</span>限时免费体验</div>
    </div>
  </div>

</div>
</body>
</html>
